name: Reproduce MATLAB case

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install Chinese fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
          fc-cache -f
      - name: Set up MATLAB R2025b and Signal Processing Toolbox
        uses: matlab-actions/setup-matlab@f9e43010f1ae678f7cfa0542fe2a4f60f7d1ad8d # v3
        with:
          release: R2025b
          products: Signal_Processing_Toolbox
          cache: true
      - name: Check reference results and reproduce the case
        uses: matlab-actions/run-command@bfa857648f4895aa98a446fe41c85e0788421ed5 # v3
        with:
          command: >-
            results = runtests('tests');
            fprintf('%s\n', jsonencode(struct('total', numel(results), 'passed', nnz([results.Passed]), 'failed', nnz([results.Failed]))));
            assertSuccess(results);
            run_demo;
      - name: Upload generated figures and numerical results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: matlab-case-results
          path: output/
          if-no-files-found: error
          retention-days: 7
